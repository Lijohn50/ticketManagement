<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ticket Booking System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            text-align: center;
        }
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
            background: #fafafa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            grid-column: span 2;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .actions a {
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 4px;
            color: white;
            font-size: 12px;
            margin-right: 5px;
        }
        .btn-edit {
            background-color: #ffc107;
            color: #333 !important;
        }
        .btn-delete {
            background-color: #dc3545;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎟️ Ticket Booking Portal</h2>

    <!-- Ticket Form (Create & Update) -->
    <form action="#" th:action="@{/save}" th:object="${ticket}" method="post">

        <div class="form-group">
            <label for="eventName">Event Name:</label>
            <input type="text" id="eventName" th:field="*{eventName}" required placeholder="e.g. Rock Concert" />
        </div>

        <div class="form-group">
            <label for="customerName">Customer Name:</label>
            <input type="text" id="customerName" th:field="*{customerName}" required placeholder="e.g. John Doe" />
        </div>

        <div class="form-group">
            <label for="price">Price ($):</label>
            <input type="number" step="0.01" id="price" th:field="*{price}" required placeholder="50.00" />
        </div>

        <div class="form-group">
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" th:field="*{quantity}" required placeholder="1" />
        </div>

        <button type="submit" th:text="${ticket.id == null} ? 'Buy Ticket' : 'Update Ticket'">Save Ticket</button>
    </form>

    <!-- Ticket List Table -->
    <h2>Booked Tickets</h2>
    <table>
        <thead>
        <tr>
            <th>Event</th>
            <th>Customer</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${tickets.empty}">
            <td colspan="5" style="text-align: center;">No tickets booked yet.</td>
        </tr>
        <tr th:each="t : ${tickets}">
            <td th:text="${t.eventName}">Event</td>
            <td th:text="${t.customerName}">Customer</td>
            <td th:text="${'$' + #numbers.formatDecimal(t.price, 1, 2)}">$0.00</td>
            <td th:text="${t.quantity}">1</td>
            <td class="actions">
                <a th:href="@{/edit/{id}(id=${t.id})}" class="btn-edit">Edit</a>
                <a th:href="@{/delete/{id}(id=${t.id})}" class="btn-delete" onclick="return confirm('Are you sure you want to cancel/delete this ticket?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
